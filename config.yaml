app:
  log_level: ${LOG_LEVEL:-INFO}
  output_dir: ${OUTPUT_DIR:-./output}

flows:
  jd_pdf:
    output_dir: ${JD_PDF_OUTPUT_DIR:-./raw_data/jd_pdf}
    browser_user_data_dir: ${JD_BROWSER_USER_DATA_DIR:-./raw_data/jd_browser_profile}
    headless: ${JD_PDF_HEADLESS:-false}
    wait_seconds: ${JD_PDF_WAIT_SECONDS:-5}
    login_timeout_seconds: ${JD_LOGIN_TIMEOUT_SECONDS:-300}
    order_pages:
      2024: 4
      2023: 5
      2022: 4
      2021: 4
      2020: 6
      2019: 5
      2018: 3
      2017: 3
      2016: 2
      2015: 2

llamacpp:
  base_url: ${LLAMACPP_BASE_URL:-http://127.0.0.1:8080/v1}
  model: ${LLAMACPP_MODEL:-local-model}
  api_key: ${LLAMACPP_API_KEY:-}
  status_timeout_sec: ${LLAMACPP_STATUS_TIMEOUT_SEC:-3}
  timeout_sec: ${LLAMACPP_TIMEOUT_SEC:-120}
  max_tokens: ${LLAMACPP_MAX_TOKENS:-4096}
  temperature: ${LLAMACPP_TEMPERATURE:-0}

financial_email:
  output_dir: ${FINANCIAL_EMAIL_OUTPUT_DIR:-./raw_data/financial_email}
  mailbox: ${FINANCIAL_EMAIL_MAILBOX:-INBOX}
  since: ${FINANCIAL_EMAIL_SINCE:-2015-01-01}
  before: ${FINANCIAL_EMAIL_BEFORE:-}
  max_messages: ${FINANCIAL_EMAIL_MAX_MESSAGES:-200}
  subject_keywords: ${FINANCIAL_EMAIL_SUBJECT_KEYWORDS_JSON:-["银行","账单","流水","交易","动账","入账","扣款","信用卡","借记卡","电子回单","对账单"]}
  imap:
    host: ${FINANCIAL_EMAIL_IMAP_HOST:-imap.126.com}
    port: ${FINANCIAL_EMAIL_IMAP_PORT:-993}
    user: ${FINANCIAL_EMAIL_IMAP_USER:-}
    password: ${FINANCIAL_EMAIL_IMAP_PASSWORD:-}
    support_email: ${FINANCIAL_EMAIL_CLIENT_SUPPORT_EMAIL:-support@example.invalid}
    client_id:
      name: FinancialTrack
      version: "1.0"
      vendor: local-python
      support-email: ${FINANCIAL_EMAIL_CLIENT_SUPPORT_EMAIL:-support@example.invalid}
  rules:
    - bank_key: cmb
      bank_name: 招商银行
      sender_contains: ["cmbchina", "cmb"]
      subject_contains: ["招商银行", "信用卡", "账单", "交易", "动账"]
      body_contains: ["招商银行", "尾号"]
    - bank_key: icbc
      bank_name: 工商银行
      sender_contains: ["icbc"]
      subject_contains: ["工商银行", "工银", "交易", "账单"]
      body_contains: ["工商银行", "工银"]
    - bank_key: ccb
      bank_name: 建设银行
      sender_contains: ["ccb"]
      subject_contains: ["建设银行", "建行", "交易", "账单"]
      body_contains: ["建设银行", "建行"]
    - bank_key: abc
      bank_name: 农业银行
      sender_contains: ["abchina", "abc"]
      subject_contains: ["农业银行", "农行", "交易", "账单"]
      body_contains: ["农业银行", "农行"]
    - bank_key: boc
      bank_name: 中国银行
      sender_contains: ["bank-of-china", "boc"]
      subject_contains: ["中国银行", "中行", "交易", "账单"]
      body_contains: ["中国银行", "中行"]

financial_attachments:
  password_env_file: ${FINANCIAL_ATTACHMENT_PASSWORD_ENV_FILE:-./financial_attachment_passwords.env}

financial_document_ai_fallback:
  enabled: ${FINANCIAL_DOCUMENT_AI_FALLBACK_ENABLED:-true}
  max_documents: ${FINANCIAL_DOCUMENT_AI_FALLBACK_MAX_DOCUMENTS:-10}
  max_chars: ${FINANCIAL_DOCUMENT_AI_FALLBACK_MAX_CHARS:-24000}
  max_tokens: ${FINANCIAL_DOCUMENT_AI_FALLBACK_MAX_TOKENS:-4096}

financial_attachment_cracker:
  hashcat_path: ${FINANCIAL_ATTACHMENT_HASHCAT_PATH:-../hashcat/hashcat.exe}
  zip2john_path: ${FINANCIAL_ATTACHMENT_ZIP2JOHN_PATH:-../john-1.9.0-jumbo-1-win64/run/zip2john.exe}
  pdf2john_path: ${FINANCIAL_ATTACHMENT_PDF2JOHN_PATH:-../john-1.9.0-jumbo-1-win64/run/pdf2john.pl}
  hashcat_extra_args: ${FINANCIAL_ATTACHMENT_HASHCAT_EXTRA_ARGS_JSON:-["--backend-ignore-cuda","--backend-ignore-hip"]}
